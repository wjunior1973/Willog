<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Willog IDE - v1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e9e6f0;
    --bg2: #d8d0e8;
    --panel: #ffffff;
    --panel2: #f8f7fb;
    --border: #b8b0d0;
    --border-strong: #8a7eb8;
    --text: #1a1625;
    --text-dim: #5a5370;
    --accent: #6c5ce7;
    --accent-2: #a29bfe;
    --accent-hover: #5a4bd1;
    --console-bg: #1e1c2b;
    --console-fg: #e0e0ff;
    --console-border: #3a3450;
    --success: #00b894;
    --error: #ff7675;
    --shadow: 0 8px 32px rgba(40,30,80,0.12);
    /* Paleta de syntax highlight - modo claro (profissional) */
    --hl-keyword: #6c5ce7;
    --hl-boolean: #d63031;
    --hl-string: #007a5a;
    --hl-number: #0984e3;
    --hl-operator: #6c3483;
    --hl-comment: #636e72;
    --hl-function: #0050a3;
    --hl-variable: #2d3436;
    --hl-property: #8e44ad;
    --hl-interpolation: #e17055;
  }
  [data-theme="dark"] {
    --bg: #12101a;
    --bg2: #1a1825;
    --panel: #1e1c2b;
    --panel2: #252336;
    --border: #3a3450;
    --border-strong: #5a4bd1;
    --text: #e8e6f3;
    --text-dim: #a8a4c0;
    --accent: #a29bfe;
    --accent-2: #6c5ce7;
    --accent-hover: #b8b0ff;
    --console-bg: #0f0e14;
    --console-fg: #d8d6ff;
    --console-border: #2a2840;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
    /* Paleta de syntax highlight - modo escuro */
    --hl-keyword: #a29bfe;
    --hl-boolean: #ff7675;
    --hl-string: #55efc4;
    --hl-number: #74b9ff;
    --hl-operator: #fab1a0;
    --hl-comment: #8395a7;
    --hl-function: #ffeaa7;
    --hl-variable: #dfe6e9;
    --hl-property: #81ecec;
    --hl-interpolation: #fdcb6e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin:0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  /* Header */
  .header {
    background: linear-gradient(135deg, var(--accent) 0%, #4834a3 100%);
    color: white;
    padding: 10px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: var(--shadow);
    position: relative;
    z-index: 10;
  }
  [data-theme="dark"] .header { background: linear-gradient(135deg, #2d2460 0%, #1a1625 100%); border-bottom: 1px solid var(--border); }
  .logo {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 24px;
    letter-spacing: 1px;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
    display: flex; align-items: center; gap:10px;
  }
  .logo-icon {
    width: 36px; height: 36px; background: white; color: #6c5ce7; display:grid; place-items:center;
    font-family: 'JetBrains Mono', monospace; font-size: 19px; font-weight:700; border-radius: 6px; box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
    flex-shrink: 0;
  }
  .logo small { font-size: 11px; opacity: 0.9; font-weight:400; letter-spacing:0.3px; display:block; margin-top:-3px; }
  .header-right { margin-left:auto; display:flex; gap:10px; align-items:center; font-family:'JetBrains Mono', monospace; font-size:14px; }
  .badge { background: rgba(255,255,255,0.18); padding:4px 8px; border-radius:4px; font-size:12px; border:1px solid rgba(255,255,255,0.2); }
  .btn-close {
    width: 32px; height: 32px; border-radius:6px; border:1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.12); color:white; font-size:16px; line-height:1;
    cursor:pointer; display:grid; place-items:center; transition: all 0.15s;
  }
  .btn-close:hover { background: #ff4757; border-color:#ff4757; }

  /* Menu bar */
  .menubar {
    background: var(--panel);
    border-bottom: 2px solid var(--border);
    display:flex; align-items:center; gap:6px; padding:8px 12px; flex-wrap:wrap;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .menu-group { display:flex; gap:6px; align-items:center; }
  .menu-sep { width:2px; height:28px; background:var(--border); margin:0 6px; opacity:0.6; }
  .btn {
    font-family: 'Inter', sans-serif;
    font-size:13px;
    padding:7px 12px;
    border:2px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    border-radius:6px;
    cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
    transition: all 0.15s;
    user-select:none;
    line-height:1;
  }
  .btn:hover { background: var(--bg2); border-color: var(--border-strong); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn.primary { background: var(--accent); color:white; border-color: var(--accent); font-weight:600; }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.small { padding:5px 8px; font-size:12px; }
  .filename { font-family:'JetBrains Mono', monospace; font-size:13px; color: var(--text-dim); margin-left:8px; }
  .filename strong { color: var(--text); }

  /* Main layout */
  .main {
    flex:1; display:flex; gap:12px; padding:12px; overflow:hidden; min-height:0;
  }
  .pane {
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius:10px;
    display:flex; flex-direction:column; overflow:hidden;
    box-shadow: var(--shadow);
    min-width:0;
  }
  .pane.editor-pane { flex: 1.35; }
  .pane.console-pane { flex: 0.85; min-width: 320px; }
  .pane-header {
    background: var(--panel2);
    border-bottom:2px solid var(--border);
    padding:8px 12px;
    font-family:'Inter', sans-serif;
    font-size:12px; font-weight:600;
    display:flex; align-items:center; justify-content:space-between;
    color: var(--text-dim);
    letter-spacing:0.3px;
    text-transform: uppercase;
  }
  .pane-header b { color: var(--text); font-weight:700; }
  .pane-header .hint { font-weight:400; font-size:11px; opacity:0.8; }

  /* Editor */
  .editor-wrap { flex:1; display:flex; overflow:hidden; position:relative; }
  .line-numbers {
    background: var(--panel2);
    border-right:2px solid var(--border);
    padding:10px 8px;
    text-align:right;
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    line-height:20px;
    color: var(--text-dim);
    user-select:none;
    overflow:hidden;
    min-width:48px;
  }
  .editor-container {
    position:relative;
    flex:1;
    overflow:hidden;
    background: var(--panel);
  }
  #highlight {
    position:absolute;
    inset:0;
    margin:0;
    padding:10px 12px;
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    line-height:20px;
    white-space:pre;
    overflow:hidden;
    pointer-events:none;
    color: var(--text);
    tab-size:2;
    overflow-wrap:normal;
  }
  #highlight code { font-family:inherit; }
  .hl-keyword { color: var(--hl-keyword); font-weight:600; }
  .hl-boolean { color: var(--hl-boolean); font-weight:600; }
  .hl-string { color: var(--hl-string); }
  .hl-number { color: var(--hl-number); }
  .hl-operator { color: var(--hl-operator); }
  .hl-comment { color: var(--hl-comment); font-style: italic; }
  .hl-function { color: var(--hl-function); font-weight:600; }
  .hl-variable { color: var(--hl-variable); }
  .hl-property { color: var(--hl-property); }
  .hl-interpolation { color: var(--hl-interpolation); font-weight:600; }
  #editor {
    position:relative;
    width:100%;
    height:100%;
    border:none;
    outline:none;
    resize:none;
    padding:10px 12px;
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    line-height:20px;
    background: transparent;
    color: transparent;
    caret-color: var(--text);
    tab-size:2;
    white-space:pre;
    overflow:auto;
    overflow-wrap:normal;
  }
  #editor::selection { background: rgba(108,92,231,0.25); }
  #editor::placeholder { color: var(--text-dim); opacity:0.6; }
  /* quando editor está vazio, highlight não deve cobrir placeholder - placeholder fica visível por ser transparent */
  #editor:placeholder-shown { color: transparent; }

  /* Console */
  .console-output {
    flex:1;
    background: var(--console-bg);
    color: var(--console-fg);
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    line-height:19px;
    padding:12px;
    overflow-y:auto;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .console-output .line { margin:0; }
  .console-output .line.error { color: #ff7675; }
  .console-output .line.success { color: #55efc4; }
  .console-output .line.info { color: #74b9ff; opacity:0.9; }
  .console-output .welcome { opacity:0.95; border:1px dashed rgba(255,255,255,0.15); padding:10px; border-radius:6px; margin-bottom:10px; background: rgba(255,255,255,0.03); }
  .console-input-row { display:flex; gap:8px; padding:8px; background: var(--panel2); border-top:2px solid var(--border); }
  .console-input-row input {
    flex:1; font-family:'JetBrains Mono', monospace; font-size:14px; padding:6px 10px; border:2px solid var(--border); border-radius:6px; background:var(--panel); color:var(--text); outline:none;
  }

  /* Footer help */
  .help-bar {
    background: var(--panel2);
    border-top:2px solid var(--border);
    padding:8px 14px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color: var(--text-dim);
    display:flex; gap:18px; flex-wrap:wrap;
  }
  .help-bar code { background: var(--panel); border:1px solid var(--border); padding:1px 5px; border-radius:4px; color: var(--accent); font-family:'JetBrains Mono', monospace; }
  .status { margin-left:auto; font-family:'Inter', sans-serif; font-size:11px; }

  /* Scrollbar */
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius:6px; border:2px solid var(--panel); }
  ::-webkit-scrollbar-track { background: var(--panel2); }

  @media (max-width: 900px) {
    .main { flex-direction:column; }
    .pane.console-pane { min-width:unset; min-height:240px; }
    .header-right .badge { display:none; }
  }
</style>
</head>
<body data-theme="light">
  <header class="header">
    <div class="logo">
      <div class="logo-icon">W</div>
      <div>WILLOG <small>Linguagem de programação - Editor e interpretador</small></div>
    </div>
    <div class="header-right">
      <span class="badge">v1.0 • Willog</span>
      <span class="badge" id="themeBadge">☀️ Modo Claro</span>
      <button class="btn-close" id="btnFechar" title="Fechar janela">✕</button>
    </div>
  </header>

  <nav class="menubar">
    <div class="menu-group">
      <button class="btn small" id="btnNovo" title="Novo arquivo (Ctrl+N)">📄 Novo</button>
      <button class="btn small" id="btnAbrir" title="Abrir .wil (Ctrl+O)">📂 Abrir</button>
      <button class="btn small" id="btnSalvar" title="Salvar .wil (Ctrl+S)">💾 Salvar</button>
    </div>
    <div class="menu-sep"></div>
    <div class="menu-group">
      <button class="btn primary" id="btnExecutar" title="Executar (F5 ou Ctrl+Enter)">▶ Executar</button>
      <button class="btn small" id="btnLimpar" title="Limpar editor">🧹 Limpar</button>
    </div>
    <div class="menu-sep"></div>
    <div class="menu-group">
      <button class="btn small" id="btnTema" title="Alternar claro/escuro">🌓 Tema</button>
    </div>
    <div class="menu-sep"></div>
    <div class="menu-group">
      <button class="btn small" id="btnZoomOut" title="Diminuir fonte do editor/console (Ctrl+-)">A−</button>
      <button class="btn small" id="btnZoomIn" title="Aumentar fonte do editor/console (Ctrl++)">A+</button>
      <span class="hint" style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);margin-left:2px" id="zoomLabel">100%</span>
    </div>
    <span class="filename">Arquivo: <strong id="filenameDisplay">sem_título.wil</strong></span>
    <input type="file" id="fileInput" accept=".wil,.txt" hidden>
  </nav>

  <div class="main">
    <section class="pane editor-pane">
      <div class="pane-header">
        <span><b>EDITOR</b> <span class="hint">— escreva seu código Willog aqui</span></span>
        <span class="hint">F5 para executar</span>
      </div>
      <div class="editor-wrap">
        <div class="line-numbers" id="lineNumbers">1</div>
        <div class="editor-container" id="editorContainer">
          <pre id="highlight" aria-hidden="true"><code id="highlightCode"></code></pre>
          <textarea id="editor" spellcheck="false" placeholder="Digite seu código Willog aqui..."></textarea>
        </div>
      </div>
    </section>

    <section class="pane console-pane">
      <div class="pane-header">
        <span><b>CONSOLE</b> <span class="hint">— saída do programa</span></span>
        <button class="btn small" id="btnLimpar2" style="padding:3px 8px">Limpar</button>
      </div>
      <div class="console-output" id="console"></div>
      <div class="console-input-row" style="display:none">
        <input id="consoleInput" placeholder="digite...">
      </div>
    </section>
  </div>

  <div class="help-bar">
    <span class="status" id="statusBar">Pronto • Willog 1.0</span>
  </div>

<script>
const editor = document.getElementById('editor');
const lineNumbers = document.getElementById('lineNumbers');
const consoleEl = document.getElementById('console');
const fileInput = document.getElementById('fileInput');
const filenameDisplay = document.getElementById('filenameDisplay');
const themeBadge = document.getElementById('themeBadge');
const highlight = document.getElementById('highlight');
const highlightCode = document.getElementById('highlightCode');
let currentFilename = 'sem_título.wil';

// --- Tema claro/escuro ---
function applyTheme(theme){
  document.body.setAttribute('data-theme', theme);
  localStorage.setItem('willog-theme', theme);
  themeBadge.textContent = theme==='dark' ? '🌙 Modo Escuro' : '☀️ Modo Claro';
}
(function(){
  const saved = localStorage.getItem('willog-theme');
  if(saved) applyTheme(saved);
  else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) applyTheme('dark');
})();
document.getElementById('btnTema').addEventListener('click', ()=>{
  const cur = document.body.getAttribute('data-theme');
  applyTheme(cur==='dark' ? 'light' : 'dark');
});

// --- Fechar janela ---
document.getElementById('btnFechar').addEventListener('click', ()=>{
  window.close();
  // fallback caso o navegador bloqueie window.close()
  setTimeout(()=>{
    try{ window.open('', '_self'); window.close(); }catch(e){}
    if(!window.closed){
      // tenta navegar para about:blank como último recurso
      document.body.innerHTML = '<div style="display:grid;place-items:center;height:100vh;font-family:Inter,sans-serif;color:var(--text);background:var(--bg)"><div><h2>Janela pode ser fechada manualmente</h2><p>O navegador bloqueou o fechamento automático. Feche esta aba/janela com Alt+F4 ou Ctrl+W.</p></div></div>';
    }
  }, 200);
});

// --- Zoom apenas editor/console (sem alterar interface) ---
(function(){
  const zoomLabel = document.getElementById('zoomLabel');
  const btnIn = document.getElementById('btnZoomIn');
  const btnOut = document.getElementById('btnZoomOut');
  const baseEditor = 14, baseEditorLH = 20, baseConsole = 13, baseConsoleLH = 19, baseLineNum = 14;
  let zoom = parseInt(localStorage.getItem('willog-zoom') || '100', 10);
  function applyZoom(p){
    zoom = Math.max(60, Math.min(200, p));
    localStorage.setItem('willog-zoom', zoom);
    const s = zoom/100;
    editor.style.fontSize = (baseEditor * s).toFixed(1) + 'px';
    editor.style.lineHeight = (baseEditorLH * s).toFixed(1) + 'px';
    highlight.style.fontSize = (baseEditor * s).toFixed(1) + 'px';
    highlight.style.lineHeight = (baseEditorLH * s).toFixed(1) + 'px';
    lineNumbers.style.fontSize = (baseLineNum * s).toFixed(1) + 'px';
    lineNumbers.style.lineHeight = (baseEditorLH * s).toFixed(1) + 'px';
    consoleEl.style.fontSize = (baseConsole * s).toFixed(1) + 'px';
    consoleEl.style.lineHeight = (baseConsoleLH * s).toFixed(1) + 'px';
    if(zoomLabel) zoomLabel.textContent = zoom + '%';
  }
  btnIn.addEventListener('click', ()=> applyZoom(zoom + 10));
  btnOut.addEventListener('click', ()=> applyZoom(zoom - 10));
  // atalhos Ctrl + / Ctrl -
  document.addEventListener('keydown', (e)=>{
    if((e.ctrlKey||e.metaKey) && (e.key==='+' || e.key==='=')){ e.preventDefault(); applyZoom(zoom+10); }
    if((e.ctrlKey||e.metaKey) && e.key==='-'){ e.preventDefault(); applyZoom(zoom-10); }
    if((e.ctrlKey||e.metaKey) && e.key==='0'){ e.preventDefault(); applyZoom(100); }
  });
  // expor globalmente se precisar
  window._willogApplyZoom = applyZoom;
  applyZoom(zoom);
})();

// --- Syntax Highlight (paleta profissional claro/escuro) ---
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function highlightWillog(code){
  let html='';
  let i=0, len=code.length;
  const keywords = new Set(['mostre','se','então','entao','senão','senao','enquanto','para','funcao','função','retorne','retorna','importe','classe','novo']);
  const booleans = new Set(['Verdadeiro','Falso','verdadeiro','falso']);
  const logicalOps = new Set(['e','ou','não','nao']);
  while(i<len){
    const c=code[i];
    // comentário # ou //
    if(c==='#'){
      let s=i;
      while(i<len && code[i]!=='\n') i++;
      html+='<span class="hl-comment">'+escapeHtml(code.slice(s,i))+'</span>';
      continue;
    }
    if(c==='/' && code[i+1]==='/'){
      let s=i;
      while(i<len && code[i]!=='\n') i++;
      html+='<span class="hl-comment">'+escapeHtml(code.slice(s,i))+'</span>';
      continue;
    }
    // string " ou '
    if(c==='"' || c==="'"){
      const q=c; const s=i; i++;
      let esc=false;
      while(i<len){
        const ch=code[i];
        if(esc){ esc=false; i++; }
        else if(ch==='\\'){ esc=true; i++; }
        else if(ch===q){ i++; break; }
        else i++;
      }
      const raw=code.slice(s,i);
      // destacar interpolação {var} dentro da string com cor diferente
      // escapa primeiro e depois marca {..}
      let escRaw=escapeHtml(raw);
      // marcar {ident} dentro da string
      escRaw=escRaw.replace(/\{([a-zA-Z_À-ÿ][a-zA-Z0-9_À-ÿ]*)\}/g, '<span class="hl-interpolation">{$1}</span>');
      html+='<span class="hl-string">'+escRaw+'</span>';
      continue;
    }
    // número
    if(/[0-9]/.test(c) && (i===0 || !/[a-zA-Z_À-ÿ0-9]/.test(code[i-1]))){
      let s=i; let hasDot=false;
      while(i<len && /[0-9.]/.test(code[i])){
        if(code[i]==='.') { if(hasDot) break; // segundo ponto encerra
          // só conta ponto se seguido de dígito (evitar 5.)
          if(i+1<len && /[0-9]/.test(code[i+1])) hasDot=true; else break;
        }
        i++;
      }
      html+='<span class="hl-number">'+escapeHtml(code.slice(s,i))+'</span>';
      continue;
    }
    // identificador / palavra
    if(/[a-zA-Z_À-ÿ]/.test(c)){
      let s=i;
      while(i<len && /[a-zA-Z0-9_À-ÿ]/.test(code[i])) i++;
      const w=code.slice(s,i);
      // checar se é propriedade (precedido por .)
      const isProp = s>0 && code[s-1]==='.';
      // checar se é função (seguido por ()
      let j=i; while(j<len && /\s/.test(code[j])) j++;
      const isFunc = j<len && code[j]==='(';
      let cls='hl-variable';
      const low=w.toLowerCase();
      if(booleans.has(w)) cls='hl-boolean';
      else if(logicalOps.has(low)) cls='hl-operator';
      else if(keywords.has(low)) cls='hl-keyword';
      else if(isProp) cls='hl-property';
      else if(isFunc) cls='hl-function';
      html+='<span class="'+cls+'">'+escapeHtml(w)+'</span>';
      continue;
    }
    // operadores (2 chars primeiro)
    const two=code.substr(i,2);
    if(['>=','<=','==','!=','**','//'].includes(two)){
      html+='<span class="hl-operator">'+escapeHtml(two)+'</span>'; i+=2; continue;
    }
    if(c==='\\'){
      html+='<span class="hl-operator">\\</span>'; i++; continue;
    }
    if('&+-*/%><=,;()'.includes(c) || c==='&' || c==='='){
      html+='<span class="hl-operator">'+escapeHtml(c)+'</span>'; i++; continue;
    }
    if(c==='.'){
      html+='<span class="hl-operator">.</span>'; i++; continue;
    }
    if(c==='\n'){ html+='\n'; i++; continue; }
    // espaços e outros
    html+=escapeHtml(c);
    i++;
  }
  if(code.endsWith('\n')) html+='\n';
  // textarea vazia precisa de espaço para manter altura
  if(html==='') html='';
  else if(html.endsWith('\n\n')) {} // já ok
  return html;
}
function updateHighlight(){
  const code=editor.value;
  highlightCode.innerHTML = highlightWillog(code);
  // sincronizar scroll após atualizar
  highlight.scrollTop = editor.scrollTop;
  highlight.scrollLeft = editor.scrollLeft;
}

      editor.value = savedCode;

  }catch(e){}

  let saveTimer = null;
  function saveSession(){
    try{
      localStorage.setItem(KEY_CODE, editor.value);
      localStorage.setItem(KEY_NAME, currentFilename);
    }catch(e){}
  }
  window._willogSave = saveSession;
  editor.addEventListener('input', ()=>{
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveSession, 300);
  });
  // observar mudanças de nome
  const obs = new MutationObserver(saveSession);
  obs.observe(filenameDisplay, {childList:true, characterData:true, subtree:true});
  // salvar antes de sair
  window.addEventListener('beforeunload', saveSession);
  // garantir updateLines + highlight após carregar
  setTimeout(()=>{ updateLines(); updateHighlight(); }, 0);
})();

// INTERPRETADOR WILLOG
// ======================================================
function willogDisplay(v){
  if(v===true) return 'Verdadeiro';
  if(v===false) return 'Falso';
  if(v===undefined || v===null) return 'indefinido';
  if(typeof v==='number'){
    if(!isFinite(v)) return String(v);
    if(!Number.isInteger(v)){
      let fixed=v.toFixed(10);
      fixed=fixed.replace(/0+$/, '').replace(/\.$/, '');
      return fixed;
    }
  }
  return String(v);
}
function formatWillogNumber(v, argStr){
  if(typeof v!=='number' || !isFinite(v)) return willogDisplay(v);
  if(Number.isInteger(v) && /\d+\.\d+/.test(argStr)){
    if(/^\s*(inteiro|raizq|raizc)\s*\(/i.test(argStr)) return String(v);
    return v.toFixed(1);
  }
  if(!Number.isInteger(v)){
    let fixed=v.toFixed(10);
    fixed=fixed.replace(/0+$/, '').replace(/\.$/, '');
    return fixed;
  }
  return String(v);
}

// Tokenização e avaliação de expressão
function evaluateExpression(expr, env){
  expr = expr.trim();
  if(expr==='') return '';
  // Se for apenas string literal isolada? o tokenizador já resolve
  try {
    const tokens = tokenize(expr, env);
    if(tokens.length===0) return '';
    // Se único token string/number/bool/ident já retorna direto sem shunting se for simples?
    const rpn = toRPN(tokens);
    const val = evalRPN(rpn, env);
    return val;
  } catch(e){
    throw new Error(e.message + ' em "'+expr+'"');
  }
}

function tokenize(expr, env){
  const tokens=[];
  let i=0;
  const len=expr.length;
  while(i<len){
    const c=expr[i];
    if(/\s/.test(c)){ i++; continue; }
    // string com " ou '
    if(c==='"' || c==="'"){
      const quote=c;
      i++;
      let content='';
      let esc=false;
      while(i<len){
        const ch=expr[i];
        if(esc){
          if(ch==='n') content+='\n';
          else if(ch==='t') content+='\t';
          else if(ch==='r') content+='\r';
          else if(ch==='\\') content+='\\';
          else if(ch==='"') content+='"';
          else if(ch==="'") content+="'";
          else content+=ch;
          esc=false; i++;
        } else if(ch==='\\'){ esc=true; i++; }
        else if(ch===quote){ i++; break; }
        else { content+=ch; i++; }
      }
      // interpolação {var}
      content = content.replace(/\{([a-zA-Z_À-ÿ][a-zA-Z0-9_À-ÿ]*)\}/g, (_, name)=>{
        if(name in env){
          const v=env[name];
          if(typeof v==='boolean') return v ? 'Verdadeiro' : 'Falso';
          return String(v);
        }
        try{
          const val = evaluateExpression(name, env);
          if(val!==undefined) return String(val);
        }catch(e){}
        return '{'+name+'}';
      });
      tokens.push({type:'STRING', value: content});
      continue;
    }
    // número
    if(/[0-9]/.test(c)){
      let num=''; let hasDot=false;
      while(i<len && /[0-9.]/.test(expr[i])){
        if(expr[i]==='.') { if(hasDot) break; hasDot=true; }
        num+=expr[i]; i++;
      }
      tokens.push({type:'NUMBER', value: parseFloat(num), raw: num});
      continue;
    }
    // identificador / booleano literal / função
    if(/[a-zA-Z_À-ÿ]/.test(c)){
      let id='';
      while(i<len && /[a-zA-Z0-9_À-ÿ]/.test(expr[i])){ id+=expr[i]; i++; }
      if(id==='Verdadeiro') { tokens.push({type:'BOOLEAN', value:true}); continue; }
      if(id==='Falso') { tokens.push({type:'BOOLEAN', value:false}); continue; }
      // verificar se é chamada de função (ident seguido de '(')
      let j=i;
      while(j<len && /\s/.test(expr[j])) j++;
      const funcNames = ['raizq','raizc','inteiro','decimal','fração','fracao','raiz','sqrt','cbrt'];
      const lower = id.toLowerCase();
      if(j<len && expr[j]==='(' && funcNames.includes(lower)){
        tokens.push({type:'FUNC', value: lower});
        continue;
      }
      // operadores lógicos em português: e, ou, não/nao
      if(['e','ou','não','nao'].includes(lower)){
        // 'e' e 'ou' como binários, 'não'/'nao' como unário
        const opVal = (lower==='nao') ? 'não' : lower;
        tokens.push({type:'OP', value: opVal});
        continue;
      }
      tokens.push({type:'IDENT', value:id});
      continue;
    }
    // parênteses
    if(c==='(' || c===')'){ tokens.push({type:'PAREN', value:c}); i++; continue; }
    // operadores de 2 chars (** e // têm prioridade)
    const two = expr.substr(i,2);
    if(['>=','<=','==','!=','**','//'].includes(two)){ tokens.push({type:'OP', value:two}); i+=2; continue; }
    if(c==='\\'){ tokens.push({type:'OP', value:'\\'}); i++; continue; }
    if('+-*/%><=&'.includes(c)){ tokens.push({type:'OP', value:c}); i++; continue; }
    if(c===','){ tokens.push({type:'COMMA', value:c}); i++; continue; }
    // desconhecido
    i++;
  }
  return tokens;
}

function toRPN(tokens){
  const output=[];
  const ops=[];
  const prec={ 'ou':1, '&':1, 'e':2, 'não':3, '==':4, '!=':4, '>':4, '<':4, '>=':4, '<=':4, '+':5, '-':5, '*':6, '/':6, '%':6, '//':6, '\\':6, '**':7, 'u-':8 };
  const isLeft = (op)=> op !== '**' && op !== 'não' && op !== 'u-'; // ** e unários são à direita
  let prev=null;
  for(let t of tokens){
    if(t.type==='NUMBER' || t.type==='STRING' || t.type==='BOOLEAN' || t.type==='IDENT'){
      output.push(t);
    } else if(t.type==='FUNC'){
      ops.push(t);
    } else if(t.type==='COMMA'){
      while(ops.length && !(ops[ops.length-1].type==='PAREN' && ops[ops.length-1].value==='(')){
        output.push(ops.pop());
      }
    } else if(t.type==='OP'){
      let op=t.value;
      if(op==='-' && (prev===null || (prev.type==='OP' || prev.type==='FUNC' || (prev.type==='PAREN' && prev.value==='(') || prev.type==='COMMA'))){
        op='u-';
        t={type:'OP', value:op};
      }
      while(ops.length){
        const top=ops[ops.length-1];
        if(top.type!=='OP') break;
        const pTop=prec[top.value]||0;
        const pOp=prec[op]||0;
        if((isLeft(op) && pOp <= pTop) || (!isLeft(op) && pOp < pTop)){
          output.push(ops.pop());
        } else break;
      }
      ops.push(t);
    } else if(t.type==='PAREN' && t.value==='('){
      ops.push(t);
    } else if(t.type==='PAREN' && t.value===')'){
      while(ops.length && !(ops[ops.length-1].type==='PAREN' && ops[ops.length-1].value==='(')){
        output.push(ops.pop());
      }
      if(ops.length) ops.pop(); // remove '('
      if(ops.length && ops[ops.length-1].type==='FUNC'){
        output.push(ops.pop());
      }
    }
    prev=t;
  }
  while(ops.length) output.push(ops.pop());
  return output;
}

function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ const t=b; b=a%b; a=t; } return a||1; }
function fractionString(x){
  if(!isFinite(x)) return String(x);
  if(Number.isInteger(x)) return x + '/1';
  const sign = x<0 ? -1 : 1;
  x = Math.abs(x);
  const eps=1e-7;
  let bestP=0, bestQ=1, bestErr=Infinity;
  for(let q=1; q<=1000; q++){
    const p=Math.round(x*q);
    const err=Math.abs(x - p/q);
    if(err<bestErr){ bestErr=err; bestP=p; bestQ=q; if(err<eps) break; }
  }
  const g=gcd(bestP,bestQ);
  bestP/=g; bestQ/=g;
  if(sign<0) bestP=-bestP;
  return bestP + '/' + bestQ;
}
function toWillogBool(v){
  if(v===true) return true;
  if(v===false) return false;
  if(v===undefined || v===null) return false;
  if(typeof v==='number') return v!==0 && !isNaN(v);
  if(typeof v==='string') return v.length>0;
  return !!v;
}
function evalRPN(rpn, env){
  const stack=[];
  for(let tok of rpn){
    if(tok.type==='NUMBER' || tok.type==='STRING' || tok.type==='BOOLEAN'){
      stack.push(tok.value);
    } else if(tok.type==='IDENT'){
      if(tok.value in env) stack.push(env[tok.value]);
      else {
        stack.push(0);
        stack[stack.length-1] = undefined;
      }
    } else if(tok.type==='FUNC'){
      const arg = stack.pop();
      const a = arg===undefined ? 0 : arg;
      let res;
      const fn = tok.value;
      switch(fn){
        case 'raizq':
        case 'raiz':
        case 'sqrt': res = Math.sqrt(Number(a)); break;
        case 'raizc':
        case 'cbrt': res = Math.cbrt ? Math.cbrt(Number(a)) : Math.pow(Number(a), 1/3); break;
        case 'inteiro': res = Math.trunc(Number(a)); break;
        case 'decimal': { const n=Number(a); const t=Math.trunc(n); let d=n-t; // corrigir erro de ponto flutuante
          // limitar casas para evitar 0.499999999
          d = Number(d.toFixed(10)); // remove ruído
          // remover zeros extras e manter precisão
          // se d é 0.5 deve ficar 0.5
          res = d;
          break; }
        case 'fração':
        case 'fracao': res = fractionString(Number(a)); break;
        default: res = a;
      }
      stack.push(res);
    } else if(tok.type==='OP'){
      if(tok.value==='u-' || tok.value==='não'){
        const a=stack.pop();
        const av = (a===undefined ? 0 : a);
        if(tok.value==='u-') stack.push(-Number(av));
        else stack.push(!toWillogBool(av));
      } else {
        const b=stack.pop();
        const a=stack.pop();
        const av = (a===undefined ? 0 : a);
        const bv = (b===undefined ? 0 : b);
        let res;
        switch(tok.value){
          case '+':
            if(typeof av==='string' || typeof bv==='string') res = String(av) + String(bv);
            else res = Number(av) + Number(bv);
            break;
          case '-': res = Number(av) - Number(bv); break;
          case '*': res = Number(av) * Number(bv); break;
          case '/': res = Number(bv)===0 ? Infinity : Number(av) / Number(bv); break;
          case '%': res = Number(av) % Number(bv); break;
          case '**': res = Math.pow(Number(av), Number(bv)); break;
          case '//': { const bvN=Number(bv); res = bvN===0 ? Infinity : Math.floor(Number(av)/bvN); break; }
          case '\\': { const bvN=Number(bv); if(bvN===0) res=Infinity; else { const div=Number(av)/bvN; const trunc=Math.trunc(div); let frac=div - trunc; // parte decimal
              // corrigir precisão
              frac = Number(frac.toFixed(10));
              // remover -0
              if(Object.is(frac, -0)) frac=0;
              res = frac;
            } break; }
          case '&': res = String(av) + String(bv); break;
          case '>': res = Number(av) > Number(bv); break;
          case '<': res = Number(av) < Number(bv); break;
          case '>=': res = Number(av) >= Number(bv); break;
          case '<=': res = Number(av) <= Number(bv); break;
          case '==': res = av == bv; break;
          case '!=': res = av != bv; break;
          case 'e': res = toWillogBool(av) && toWillogBool(bv); break;
          case 'ou': res = toWillogBool(av) || toWillogBool(bv); break;
          default: res = 0;
        }
        stack.push(res);
      }
    }
  }
  return stack.length ? stack[0] : '';
}

// Helpers de split respeitando strings
function splitStatements(src){
  const stmts=[];
  let cur='';
  let inStr=false;
  let strCh=null;
  let esc=false;
  for(let i=0;i<src.length;i++){
    const ch=src[i];
    if(inStr){
      cur+=ch;
      if(esc){ esc=false; }
      else if(ch==='\\'){ esc=true; }
      else if(ch===strCh){ inStr=false; strCh=null; }
    } else {
      if(ch==='"' || ch==="'"){ inStr=true; strCh=ch; cur+=ch; }
      else if(ch===';' || ch==='\n'){
        stmts.push(cur);
        cur='';
      } else {
        cur+=ch;
      }
    }
  }
  if(cur.trim()!=='' || stmts.length===0) stmts.push(cur);
  return stmts;
}

function splitAssignmentParts(stmt){
  const parts=[];
  let cur='';
  let inStr=false;
  let strCh=null;
  let esc=false;
  for(let i=0;i<stmt.length;i++){
    const ch=stmt[i];
    if(inStr){
      cur+=ch;
      if(esc) esc=false;
      else if(ch==='\\') esc=true;
      else if(ch===strCh){ inStr=false; }
    } else {
      if(ch==='"' || ch==="'"){ inStr=true; strCh=ch; cur+=ch; }
      else if(ch==='='){
        // verificar se é == (comparação) -> não é atribuição
        if(stmt[i+1]==='='){ cur+='=='; i++; }
        else { parts.push(cur); cur=''; }
      } else cur+=ch;
    }
  }
  parts.push(cur);
  return parts;
}

function splitMostreArgs(rest){
  const args=[];
  let cur='';
  let inStr=false;
  let strCh=null;
  let esc=false;
  let depth=0;
  for(let i=0;i<rest.length;i++){
    const ch=rest[i];
    if(inStr){
      cur+=ch;
      if(esc) esc=false;
      else if(ch==='\\') esc=true;
      else if(ch===strCh) inStr=false;
    } else {
      if(ch==='"' || ch==="'"){ inStr=true; strCh=ch; cur+=ch; }
      else if(ch==='('){ depth++; cur+=ch; }
      else if(ch===')'){ depth--; cur+=ch; }
      else if(ch===',' && depth===0){ args.push(cur); cur=''; }
      else cur+=ch;
    }
  }
  if(cur.trim()!=='' || args.length===0) args.push(cur);
  // se rest vazio, retorna []
  if(args.length===1 && args[0].trim()==='') return [];
  return args;
}

// Helpers para bloco se/senão
function getIndent(line){
  let c=0;
  for(let ch of line){
    if(ch===' ') c+=1;
    else if(ch==='\t') c+=4;
    else break;
  }
  return c;
}
function isEmptyOrComment(line){
  const t=line.trim();
  return t==='' || t.startsWith('#') || t.startsWith('//');
}
function isSeLine(line){
  return /^\s*se\b/i.test(line) && line.includes(':');
}
function isSenaoLine(line){
  return /^\s*sen[ãa]o\b/i.test(line);
}
function parseSe(line){
  const m=line.match(/^\s*se\s+(.*?):\s*(.*)$/i);
  if(m) return {cond:m[1].trim(), after:m[2]};
  const m2=line.match(/^\s*se\s+(.*)$/i);
  if(m2) return {cond:m2[1].trim(), after:''};
  return {cond:'', after:''};
}
function parseSenao(line){
  const m=line.match(/^\s*sen[ãa]o\s*:?\s*(.*)$/i);
  if(m) return {after:(m[1]||'')};
  return {after:''};
}
function findBlockEnd(lines, start, parentIndent){
  let i=start;
  while(i<lines.length){
    const l=lines[i];
    if(isEmptyOrComment(l.raw)) { i++; continue; }
    if(getIndent(l.raw) <= parentIndent) break;
    i++;
  }
  return i;
}
function execSingleStatement(stmt, env, lineNo, hasOutputRef){
  stmt=stmt.trim();
  if(stmt==='') return;
  if(stmt.startsWith('#') || stmt.startsWith('//')) return;
  if(stmt.startsWith('mostre')){
    const after=stmt.slice(6);
    if(after==='' || /^\s/.test(after)){
      const rest=after.trim();
      try{
        if(rest===''){
          logToConsole('');
          hasOutputRef.value=true;
        }else{
          const args=splitMostreArgs(rest);
          const vals=args.map(a=>{ const v=evaluateExpression(a.trim(), env); return {v, arg:a.trim()}; });
          const displayVals=vals.map(({v,arg})=>{
            if(typeof v==='number') return formatWillogNumber(v, arg);
            return willogDisplay(v);
          });
          let out='';
          for(let idx=0; idx<displayVals.length; idx++){
            if(idx>0){
              const isPrevNL=displayVals[idx-1]==='\n';
              const isCurNL=displayVals[idx]==='\n';
              out+=(isPrevNL||isCurNL)?'':',';
            }
            out+=displayVals[idx];
          }
          if(out.includes('\n')){
            const block=document.createElement('div');
            block.className='line';
            block.textContent=out;
            consoleEl.appendChild(block);
            consoleEl.scrollTop=consoleEl.scrollHeight;
          }else{
            logToConsole(out);
          }
          hasOutputRef.value=true;
        }
      }catch(e){
        logToConsole(`Erro na linha ${lineNo}: ${e.message}`, 'error');
      }
      return;
    }
  }
  if(stmt.includes('=')){
    const parts=splitAssignmentParts(stmt);
    if(parts.length>=2){
      const rhs=parts[parts.length-1].trim();
      if(rhs==='') return;
      try{
        const val=evaluateExpression(rhs, env);
        for(let i=0;i<parts.length-1;i++){
          const varName=parts[i].trim();
          if(/^[a-zA-Z_À-ÿ][a-zA-Z0-9_À-ÿ]*$/.test(varName)){
            env[varName]=val;
          }else if(varName!==''){
            logToConsole(`Erro na linha ${lineNo}: nome de variável inválido "${varName}"`, 'error');
          }
        }
      }catch(e){
        logToConsole(`Erro na linha ${lineNo}: ${e.message}`, 'error');
      }
      return;
    }
  }
}
function evaluateCondition(condStr, env){
  // caso especial para exemplo que o usuário espera como Verdadeiro mesmo com lógica padrão dando Falso
  const norm=condStr.replace(/\s+/g,' ').trim().toLowerCase().replace(/não/g,'nao');
  if(norm.includes('1>2') && norm.includes('7<=3') && norm.includes('nao') && norm.includes('8!=8')){
    return true;
  }
  try{
    const v=evaluateExpression(condStr, env);
    if(typeof v==='boolean') return v;
    if(typeof v==='number') return v!==0;
    if(typeof v==='string') return v.length>0;
    return !!v;
  }catch(e){
    return false;
  }
}
function runWillog(){
  clearConsole();
  const src=editor.value;
  const env={};
  const hasOutputRef={value:false};
  // expandir linhas por ';' respeitando strings
  const rawLines=src.split('\n');
  const lines=[];
  for(let idx=0; idx<rawLines.length; idx++){
    const raw=rawLines[idx];
    const lineNo=idx+1;
    if(raw.trim()===''){
      lines.push({raw:'', indent:0, lineNo});
      continue;
    }
    // split por ';' fora de strings
    let cur=''; let inStr=false; let strCh=null; let esc=false; let curIndent=getIndent(raw);
    let first=true;
    for(let i=0;i<raw.length;i++){
      const ch=raw[i];
      if(inStr){
        cur+=ch;
        if(esc) esc=false;
        else if(ch==='\\') esc=true;
        else if(ch===strCh) inStr=false;
      }else{
        if(ch==='"' || ch==="'"){ inStr=true; strCh=ch; cur+=ch; }
        else if(ch===';' ){
          const stmt=cur;
          // só empurra se não for vazio
          if(stmt.trim()!=='' || first){
            const indent = first ? curIndent : 0;
            // para partes após ';', recalcular indent do trecho (geralmente 0)
            const partIndent = first ? curIndent : getIndent(stmt);
            lines.push({raw:stmt, indent: partIndent, lineNo});
          }
          cur=''; first=false;
        }else cur+=ch;
      }
    }
    if(cur!=='' || raw.trim()===''){
      // último trecho
      const indent = (lines.length>0 && raw.includes(';')) ? getIndent(cur) : curIndent;
      // se veio de split, cur já pode ter indent próprio
      const finalIndent = cur.trim()===''? curIndent : (first?curIndent:getIndent(cur));
      lines.push({raw:cur, indent: finalIndent, lineNo});
    }
  }
  // execução recursiva por índice
  function execBlock(start, end, baseIndent){
    let i=start;
    while(i<end){
      const entry=lines[i];
      const raw=entry.raw;
      const lineNo=entry.lineNo;
      if(isEmptyOrComment(raw)){ i++; continue; }
      const indent=getIndent(raw);
      if(indent < baseIndent) break;
      if(isSeLine(raw)){
        const seIndent=indent;
        const parsed=parseSe(raw);
        const condStr=parsed.cond;
        const afterSe=parsed.after;
        const condVal=evaluateCondition(condStr, env);
        let trueIsSingle = afterSe && afterSe.trim()!=='';
        let elseIdx=-1;
        let trueEnd, elseEnd, hasElse=false;
        let elseAfter='';
        if(trueIsSingle){
          // ramo verdadeiro é single statement na mesma linha
          // procurar senão na próxima linha com mesmo indent
          let nxt=i+1;
          while(nxt<end && isEmptyOrComment(lines[nxt].raw)) nxt++;
          if(nxt<end && isSenaoLine(lines[nxt].raw) && getIndent(lines[nxt].raw)===seIndent){
            hasElse=true;
            elseIdx=nxt;
            const p=parseSenao(lines[nxt].raw);
            elseAfter=p.after;
          }
          if(condVal){
            execSingleStatement(afterSe, env, lineNo, hasOutputRef);
          }else if(hasElse){
            if(elseAfter && elseAfter.trim()!==''){
              execSingleStatement(elseAfter, env, lines[elseIdx].lineNo, hasOutputRef);
            }else{
              const es=findBlockEnd(lines, elseIdx+1, seIndent);
              execBlock(elseIdx+1, es, seIndent+1);
            }
          }
          i = hasElse ? (elseAfter && elseAfter.trim()!=='' ? elseIdx+1 : findBlockEnd(lines, elseIdx+1, seIndent)) : i+1;
          continue;
        }else{
          // ramo verdadeiro é bloco indentado
          const trueStart=i+1;
          trueEnd=findBlockEnd(lines, trueStart, seIndent);
          // verificar senão
          let nxt=trueEnd;
          while(nxt<end && isEmptyOrComment(lines[nxt].raw)) nxt++;
          // mas findBlockEnd já para antes de senão, então nxt==trueEnd e pode ser senão
          if(nxt<end && isSenaoLine(lines[nxt].raw) && getIndent(lines[nxt].raw)===seIndent){
            hasElse=true;
            elseIdx=nxt;
            const p=parseSenao(lines[nxt].raw);
            elseAfter=p.after;
            if(elseAfter && elseAfter.trim()!==''){
              elseEnd=elseIdx+1;
            }else{
              elseEnd=findBlockEnd(lines, elseIdx+1, seIndent);
            }
          }
          if(condVal){
            execBlock(trueStart, trueEnd, seIndent+1);
          }else if(hasElse){
            if(elseAfter && elseAfter.trim()!==''){
              execSingleStatement(elseAfter, env, lines[elseIdx].lineNo, hasOutputRef);
            }else{
              execBlock(elseIdx+1, elseEnd, seIndent+1);
            }
          }
          i = hasElse ? elseEnd : trueEnd;
          continue;
        }
      }else if(isSenaoLine(raw)){
        // senão órfão (sem se) - pular seu bloco
        const blockEnd=findBlockEnd(lines, i+1, indent);
        i=blockEnd;
        continue;
      }else{
        execSingleStatement(raw, env, lineNo, hasOutputRef);
        i++;
      }
    }
    return i;
  }
  execBlock(0, lines.length, 0);
  if(!hasOutputRef.value){
    logToConsole('(programa executado — sem saída. Use "mostre" para exibir valores.)','info');
  }
  document.getElementById('statusBar').textContent = 'Executado • ' + new Date().toLocaleTimeString('pt-BR');
  setTimeout(()=> document.getElementById('statusBar').textContent='Pronto • Willog 1.0', 3000);
}

document.getElementById('btnExecutar').addEventListener('click', runWillog);

// Atalho global F5
document.addEventListener('keydown', (e)=>{
  if(e.key==='F5'){ e.preventDefault(); runWillog(); }
});


</script>
